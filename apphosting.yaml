# Firebase App Hosting config. See https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  # Create with: firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: GEMINI_MODEL
    value: gemini-3.5-flash-lite
    availability:
      - BUILD
      - RUNTIME
  # Optional — omit this binding entirely to ship without bilingual
  # definitions. Create with:
  # firebase apphosting:secrets:set GOOGLE_TRANSLATE_API_KEY
  - variable: GOOGLE_TRANSLATE_API_KEY
    secret: GOOGLE_TRANSLATE_API_KEY
  - variable: TRANSLATE_TARGET_LANGUAGES
    value: vi
    availability:
      - BUILD
      - RUNTIME
  # Required for sign-in. Public-safe values (not secrets — they identify
  # the project, firestore.rules is the real access control), but the
  # REPLACE-ME placeholders below need swapping for the real values from
  # Firebase Console → Project Settings → your web app before deploying.
  # Needed at BUILD time too: Next.js inlines NEXT_PUBLIC_* vars into the
  # client bundle at build, not just at runtime.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBxdYZi-c7nXRT2_7X-FOlV8J-OWvNYZ00
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: lexi-gemini.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: lexi-gemini
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: lexi-gemini.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 546019267933
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:546019267933:web:590db7b46555e29ded84b4
    availability:
      - BUILD
      - RUNTIME
